<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CDN Manager</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<div class="flex min-h-screen">

    <!-- 左侧菜单 -->
    <aside class="w-56 bg-gray-900 text-white">

        <div class="px-6 py-5 text-xl font-bold border-b border-gray-700">
            CDN Manager
        </div>

        <nav class="p-3 space-y-1">

            <a
                href="/"
                class="block px-4 py-3 rounded bg-gray-800"
            >
                首页
            </a>

            <a
                href="/groups"
                class="block px-4 py-3 rounded hover:bg-gray-800"
            >
                分组管理
            </a>

            <a
                href="/domains"
                class="block px-4 py-3 rounded hover:bg-gray-800"
            >
                域名管理
            </a>

            <a
                href="/cdn-accounts"
                class="block px-4 py-3 rounded hover:bg-gray-800"
            >
                Cloudflare 账号
            </a>

        </nav>

        <div class="absolute bottom-0 w-56 p-3">
            <button
                onclick="logout()"
                class="w-full px-4 py-2 rounded bg-red-600 hover:bg-red-700"
            >
                退出登录
            </button>
        </div>

    </aside>


    <!-- 主区域 -->
    <main class="flex-1">

        <header class="bg-white border-b px-8 py-5">
            <h1 class="text-2xl font-bold">
                首页
            </h1>
        </header>

        <div class="p-8">

            <div class="bg-white rounded-lg shadow-sm p-8">

                <h2 class="text-xl font-semibold mb-3">
                    CDN Manager
                </h2>

                <p class="text-gray-500">
                    CDN 切换管理系统
                </p>

            </div>

        </div>

    </main>

</div>

<script src="/static/js/common.js"></script>

</body>
</html>
