<!DOCTYPE html>

<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Cloudflare 账号 - CDN Manager</title>


<script src="https://cdn.tailwindcss.com"></script>


</head>

<body class="min-h-screen bg-gray-100 text-gray-900">

<div class="flex min-h-screen">


<!-- ==================== Sidebar ==================== -->
<aside class="relative flex w-56 shrink-0 flex-col bg-gray-900 text-white">

    <div class="border-b border-gray-700 px-6 py-5 text-xl font-bold">
        CDN Manager
    </div>

    <nav class="flex-1 space-y-1 p-3">

        <a
            href="/"
            class="block rounded px-4 py-3 text-gray-300 transition hover:bg-gray-800 hover:text-white"
        >
            首页
        </a>

        <a
            href="/groups"
            class="block rounded px-4 py-3 text-gray-300 transition hover:bg-gray-800 hover:text-white"
        >
            分组管理
        </a>

        <a
            href="/domains"
            class="block rounded px-4 py-3 text-gray-300 transition hover:bg-gray-800 hover:text-white"
        >
            域名管理
        </a>

        <a
            href="/cdn-accounts"
            class="block rounded bg-gray-800 px-4 py-3 text-white"
        >
            Cloudflare 账号
        </a>

    </nav>

    <div class="border-t border-gray-700 p-3">

        <button
            type="button"
            onclick="logout()"
            class="w-full rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:ring-offset-gray-900"
        >
            退出登录
        </button>

    </div>

</aside>


<!-- ==================== Main ==================== -->
<main class="min-w-0 flex-1">

    <!-- Header -->
    <header class="border-b bg-white px-8 py-5">

        <div class="flex items-center justify-between">

            <div>

                <h1 class="text-2xl font-bold text-gray-900">
                    Cloudflare 账号
                </h1>

                <p class="mt-1 text-sm text-gray-500">
                    管理 Cloudflare API 账号和 API Token
                </p>

            </div>

            <button
                type="button"
                onclick="openCDNAccountModal()"
                class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            >
                + 添加账号
            </button>

        </div>

    </header>


    <!-- Content -->
    <div class="p-8">

        <div class="overflow-hidden rounded-lg bg-white shadow-sm">

            <div class="overflow-x-auto">

                <table class="w-full min-w-[800px]">

                    <thead class="border-b bg-gray-50">

                    <tr>

                        <th
                            class="whitespace-nowrap px-6 py-4 text-left text-sm font-semibold text-gray-700"
                        >
                            ID
                        </th>

                        <th
                            class="whitespace-nowrap px-6 py-4 text-left text-sm font-semibold text-gray-700"
                        >
                            名称
                        </th>

                        <th
                            class="whitespace-nowrap px-6 py-4 text-left text-sm font-semibold text-gray-700"
                        >
                            Account ID
                        </th>

                        <th
                            class="whitespace-nowrap px-6 py-4 text-left text-sm font-semibold text-gray-700"
                        >
                            Token
                        </th>

                        <th
                            class="whitespace-nowrap px-6 py-4 text-right text-sm font-semibold text-gray-700"
                        >
                            操作
                        </th>

                    </tr>

                    </thead>

                    <tbody
                        id="cdnAccountsTableBody"
                        class="divide-y divide-gray-100"
                    >
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>


</div>

<!-- ========================================================= -->

<!-- Cloudflare Account Modal -->

<!-- ========================================================= -->

<div
    id="cdnAccountModal"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4"
>


<div
    class="w-full max-w-lg overflow-hidden rounded-xl bg-white shadow-xl"
>

    <!-- Modal Header -->
    <div class="flex items-center justify-between border-b px-6 py-4">

        <h2
            id="cdnAccountModalTitle"
            class="text-lg font-semibold text-gray-900"
        >
            添加 Cloudflare 账号
        </h2>

        <button
            type="button"
            onclick="closeCDNAccountModal()"
            class="rounded p-1 text-2xl leading-none text-gray-400 transition hover:bg-gray-100 hover:text-gray-600"
        >
            ×
        </button>

    </div>


    <!-- Form -->
    <form id="cdnAccountForm">

        <div class="space-y-5 px-6 py-6">

            <input
                id="cdnAccountId"
                type="hidden"
            >


            <!-- Name -->
            <div>

                <label
                    for="cdnAccountName"
                    class="mb-1.5 block text-sm font-medium text-gray-700"
                >
                    名称
                </label>

                <input
                    id="cdnAccountName"
                    type="text"
                    required
                    maxlength="100"
                    class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                    placeholder="例如：CF 主账号"
                >

            </div>


            <!-- Account ID -->
            <div>

                <label
                    for="cdnAccountAccountId"
                    class="mb-1.5 block text-sm font-medium text-gray-700"
                >
                    Cloudflare Account ID
                </label>

                <input
                    id="cdnAccountAccountId"
                    type="text"
                    required
                    class="w-full rounded-lg border border-gray-300 px-3 py-2.5 font-mono text-sm text-gray-900 outline-none transition placeholder:font-sans placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                    placeholder="例如：023e105f4ecef8ad9ca31a8372d0c353"
                >

            </div>


            <!-- API Token -->
            <div>

                <label
                    for="cfApiToken"
                    class="mb-1.5 block text-sm font-medium text-gray-700"
                >
                    API Token
                </label>

                <input
                    id="cfApiToken"
                    type="password"
                    autocomplete="new-password"
                    class="w-full rounded-lg border border-gray-300 px-3 py-2.5 font-mono text-sm text-gray-900 outline-none transition placeholder:font-sans placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                    placeholder="输入 Cloudflare API Token"
                >

                <p class="mt-1.5 text-xs text-gray-500">
                    编辑账号时留空表示不修改原 Token
                </p>

            </div>

        </div>


        <!-- Modal Footer -->
        <div class="flex justify-end gap-3 border-t bg-gray-50 px-6 py-4">

            <button
                type="button"
                onclick="closeCDNAccountModal()"
                class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-300"
            >
                取消
            </button>

            <button
                type="submit"
                class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            >
                保存
            </button>

        </div>

    </form>

</div>


</div>

<!-- ==================== JavaScript ==================== -->

<script src="/static/js/common.js"></script>

<script src="/static/js/cdn_accounts.js"></script>

</body>
</html>
