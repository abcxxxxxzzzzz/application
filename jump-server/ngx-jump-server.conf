# ==========================================
# 当前日期 YYYYMMDD
# ==========================================

map $time_iso8601 $jump_date {
    default "";
    "~^([0-9]{4})-([0-9]{2})-([0-9]{2})" $1$2$3;
}


# ==========================================
# Referer Host
# 从：
#
# https://5.com/
# http://5.com/
# https://5.com:443/
#
# 提取：
#
# 5.com
# ==========================================

map $http_referer $referer_host {
    default "";

    "~^https?://([^/:]+)(?::[0-9]+)?(?:/|$)" $1;
}


# ==========================================
# Referer 是否与当前 Host 一致
#
# 0 = 正常
# 1 = 非法
# ==========================================

map "$referer_host:$host" $invalid_referer {
    default 1;

    "~^(.+):\1$" 0;
}

server {
    listen 18668;

    # ==========================================
    # 拦截
    # ==========================================
    location ~ ^/(admin|api)(/|$) {
        return 404;
    }

    # ==========================================
    # /loading/
    # ==========================================
    location ^~ /loading/ {

        # ======================================
        # 当前用户 IP HASH
        # ======================================
        set_by_lua_block $current_ip_hash {
            return ngx.md5(ngx.var.remote_addr):sub(1, 12);
        }

        # ======================================
        # 从 URI 提取 loading 后面的 HASH
        # ======================================
        set_by_lua_block $url_ip_hash {
            local uri = ngx.var.uri
            local hash = uri:match("^/loading/([a-f0-9]+)%.html$")
            return hash or ""
        }

        # ======================================
        # HASH 不一致，重新访问 /
        # ======================================
        if ($url_ip_hash != $current_ip_hash) {
            return 302 /;
        }

        # ======================================
        # Referer 必须与当前访问域名一致
        # ======================================
        #if ($invalid_referer) {
        #    return 302 /;
        #}

        # ======================================
        # 反向代理 FastAPI
        # ======================================
        proxy_pass http://127.0.0.1:18667;

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        chunked_transfer_encoding on;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_redirect off;

        proxy_set_header Connection "";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # ==========================================
    # 首页
    # ==========================================
    location / {
        default_type text/html;

        # ======================================
        # 当前用户 IP HASH
        # ======================================
        set_by_lua_block $jump_date {
            return ngx.md5(ngx.var.remote_addr):sub(1, 12);
        }

        # ======================================
        # 禁止缓存
        # ======================================
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # ======================================
        # 400 + JS 跳转
        # ======================================
        return 400 '<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>百度一下</title>
    <script>
        window.location.replace("/loading/$jump_date.html?ts=$msec&s=$request_id");
    </script>
</head>
<body>
</body>
</html>';
    }
}