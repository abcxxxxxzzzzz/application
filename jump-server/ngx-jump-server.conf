# ==========================================
# 当前日期 YYYYMMDD
# ==========================================

map $time_iso8601 $jump_date {
    default "";
    "~^([0-9]{4})-([0-9]{2})-([0-9]{2})" $1$2$3;
}


# ==========================================
# Referer Host
# 从：
#
# https://5.com/
# http://5.com/
# https://5.com:443/
#
# 提取：
#
# 5.com
# ==========================================

map $http_referer $referer_host {
    default "";

    "~^https?://([^/:]+)(?::[0-9]+)?(?:/|$)" $1;
}


# ==========================================
# Referer 是否与当前 Host 一致
#
# 0 = 正常
# 1 = 非法
# ==========================================

map "$referer_host:$host" $invalid_referer {
    default 1;

    "~^(.+):\1$" 0;
}


server {
    listen 18668;

    # default
    #server_name _;


    # ==========================================
    # 拦截
    # ==========================================
    location ~ ^/(admin|api)(/|$) {
        return 404;
    }
    # ==========================================
    # /loading/
    # ==========================================

    location ^~ /loading/ {

        # ======================================
        # Referer 必须与当前访问域名一致
        # ======================================

        if ($invalid_referer) {
            return 302 /;
        }


        # ======================================
        # 反向代理 FastAPI
        # ======================================

        proxy_pass http://127.0.0.1:18667;


        # 保留原始 Host
        proxy_set_header Host $host;


        # CDN / LB
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;


        # HTTP/1.1
        proxy_http_version 1.1;


        # ======================================
        # 禁止缓存
        # ======================================

        proxy_buffering off;
        proxy_cache off;

        proxy_no_cache 1;
        proxy_cache_bypass 1;


        # ======================================
        # 保持 chunked
        # ======================================

        chunked_transfer_encoding on;


        # ======================================
        # 超时
        # ======================================

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;


        # ======================================
        # 不修改 FastAPI Location
        # ======================================

        proxy_redirect off;


        # ======================================
        # Connection
        # ======================================

        proxy_set_header Connection "";


        # ======================================
        # 禁止缓存响应
        # ======================================

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }


    # ==========================================
    # 首页
    #
    # 不反向代理
    # Nginx 直接返回 HTML
    # ==========================================

    location / {

        default_type text/html;


        # 禁止缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;


        # 400 + Meta 跳转
        return 400 '<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <meta
        http-equiv="refresh"
        content="0;url=/loading/$jump_date.html?ts=$msec&s=$request_id"
    >
</head>

<body>
</body>

</html>';
    }
}

