server {
    listen 18670;

    # ==========================================
    # /loading/
    # ==========================================
    location ^~ /loading/ {

        # ======================================
        # 当前用户 IP HASH
        # ======================================
        set_by_lua_block $current_ip_hash {
            return ngx.md5(ngx.var.remote_addr):sub(1, 12);
        }

        # ======================================
        # 从 URI 提取 loading 后面的 HASH
        # ======================================
        set_by_lua_block $url_ip_hash {
            local uri = ngx.var.uri
            local hash = uri:match("^/loading/h/([a-f0-9]+)%.html$")
            return hash or ""
        }

        # ======================================
        # HASH 不一致，重新访问 /
        # ======================================
       if ($url_ip_hash != $current_ip_hash) {
            return 302 /;
        }

        # ======================================
        # 反向代理 GinOne
        # ======================================
        proxy_pass http://127.0.0.1:18669/app/v1/;

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        chunked_transfer_encoding on;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_redirect off;

        proxy_set_header Connection "";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # ==========================================
    # /app/v1/
    # ==========================================
    location ^~ /app/v1/ {
        # ======================================
        # 反向代理 GinOne
        # ======================================
        proxy_pass http://127.0.0.1:18669/app/v1/;

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        chunked_transfer_encoding on;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_redirect off;

        proxy_set_header Connection "";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # ==========================================
    # 首页
    # ==========================================
    location / {
        default_type text/html;

        # ======================================
        # 当前用户 IP HASH
        # ======================================
        set_by_lua_block $jump_date {
            return ngx.md5(ngx.var.remote_addr):sub(1, 12);
        }

        # ======================================
        # 禁止缓存
        # ======================================
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # ======================================
        # 400 + JS 跳转
        # ======================================
        return 400 '<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>百度一下</title>
    <script>
        window.location.replace("/loading/h/$jump_date.html?ts=$msec&s=$request_id");
    </script>
</head>
<body>
</body>
</html>';
    }
}
